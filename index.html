<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: salão 3D de tela cheia (preto brilhante, âmbar), HUD fino, estações embaixo, chat do Fábrik à direita (gaveta no celular). Visual único e escuro, da identidade do Fábrik. */
:root{--bg:#070605;--panel:#12100cEB;--ink:#f3ead8;--mute:#a39478;--line:#34291a;--amber:#ffb000;--amber2:#ffd25a;--ok:#4cc46a;color-scheme:dark;
 --head:'Barlow Condensed','Arial Narrow',sans-serif;--sans:'Inter',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden;overscroll-behavior:none}
#app{position:relative;height:100%;width:100%}
#stage{position:absolute;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.hud{position:absolute;z-index:3;pointer-events:none}
.hud *{pointer-events:auto}
.top{left:max(16px,env(safe-area-inset-left,0px));top:12px;right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.brand h1{font-family:var(--head);font-weight:700;font-size:1.8rem;letter-spacing:.06em;text-transform:uppercase;margin:0;line-height:1;color:var(--amber);text-shadow:0 0 18px #ffb00066}
.brand p{margin:4px 0 0;color:var(--mute);font-size:.76rem;display:flex;gap:8px;align-items:center}
.live{display:inline-flex;gap:6px;align-items:center;color:var(--ok);font-weight:600;letter-spacing:.08em;font-size:.68rem}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 1.6s infinite}
.live.off{color:var(--mute)}.live.off::before{background:var(--mute);box-shadow:none;animation:none}
@keyframes pulse{50%{opacity:.25}}
.stats{display:flex;gap:6px;margin-right:394px}
.stat{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--amber);padding:6px 12px;min-width:84px;font-variant-numeric:tabular-nums}
.stat b{display:block;font-family:var(--head);font-size:1.7rem;line-height:1;color:var(--amber2)}
.stat small{font-size:.6rem;text-transform:uppercase;letter-spacing:.12em;color:var(--mute)}
.chips{left:max(16px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 420px)}
.chips button{font-family:var(--head);font-weight:600;letter-spacing:.07em;text-transform:uppercase;font-size:.9rem;padding:6px 12px;background:var(--panel);color:var(--ink);border:1px solid var(--line);cursor:pointer}
.chips button:hover,.chips button:focus-visible,.chips button.on{border-color:var(--amber);color:var(--amber2);outline:none}
.chips button i{font-style:normal;color:var(--amber);margin-left:6px}
.legend{left:max(16px,env(safe-area-inset-left,0px));bottom:60px;display:flex;gap:12px;flex-wrap:wrap;color:var(--mute);font-size:.72rem}
.legend span::before{content:"";display:inline-block;width:9px;height:13px;margin-right:5px;vertical-align:-2px;background:var(--c)}
.legend span.w::before{width:15px;height:9px}
.ficha{left:max(16px,env(safe-area-inset-left,0px));bottom:92px;width:300px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);padding:10px 12px;font-size:.8rem}
.ficha b{display:block;font-family:var(--head);font-size:1.15rem;letter-spacing:.03em;color:var(--amber2);line-height:1.1}
.ficha p{margin:4px 0 0;color:var(--mute)}
.ficha button{float:right;background:none;border:0;color:var(--mute);cursor:pointer;font-size:1rem}
.tip{position:absolute;z-index:4;pointer-events:none;background:#070605f2;border:1px solid var(--amber);padding:6px 9px;font-size:.76rem;max-width:230px;transform:translate(12px,12px)}
.tip b{display:block;color:var(--amber2)}
.bubble{position:absolute;z-index:4;pointer-events:none;background:var(--amber);color:#1a1307;font-weight:600;font-size:.8rem;padding:6px 10px;border-radius:10px;max-width:200px;transform:translate(-50%,-100%);text-align:center}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--amber)}
.chat{position:absolute;z-index:5;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));top:12px;width:372px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--amber);backdrop-filter:blur(8px);min-height:0}
.chead{display:flex;align-items:center;gap:10px;padding:8px 12px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;color:var(--ink);font:inherit;text-align:left;width:100%}
.av{width:40px;height:40px;border-radius:50%;background:#000 var(--fab) center 6%/150% auto no-repeat;border:2px solid var(--amber);flex:none}
.chead b{font-family:var(--head);font-size:1.15rem;letter-spacing:.05em;text-transform:uppercase;display:block;line-height:1}
.chead small{color:var(--mute);font-size:.72rem}
.msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:12px}
.m{max-width:92%;padding:8px 11px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.85rem}
.m.u{align-self:flex-end;background:var(--amber);color:#1a1307;border-radius:10px 10px 2px 10px}
.m.a{align-self:flex-start;background:#211a10;border:1px solid var(--line);border-radius:10px 10px 10px 2px}
.m.t{align-self:center;color:var(--mute);font-size:.72rem;text-align:center}
.sug{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}
.sug button{font:inherit;font-size:.72rem;padding:4px 9px;border-radius:99px;border:1px solid var(--line);background:#18120a;color:var(--ink);cursor:pointer}
.sug button:hover,.sug button:focus-visible{border-color:var(--amber);outline:none}
form{display:flex;gap:6px;padding:8px 12px 12px}
textarea{flex:1;min-width:0;font:inherit;resize:none;padding:8px 10px;border:1px solid var(--line);background:#0c0905;color:var(--ink);height:44px}
textarea:focus-visible,.send:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.send{font-family:var(--head);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:1rem;padding:0 16px;border:0;background:var(--amber);color:#1a1307;cursor:pointer}
.send:disabled{opacity:.5;cursor:wait}
.player{position:absolute;z-index:6;left:0;right:394px;top:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:18px;background:#000000a8;backdrop-filter:blur(3px)}
.pf{position:relative;height:min(82vh,680px);aspect-ratio:9/17.6;background:#000;border:3px solid var(--amber);border-radius:30px;box-shadow:0 0 50px #ffb00055;padding:10px;max-width:92vw}
.pf video{width:100%;height:100%;object-fit:contain;border-radius:20px;background:#000;display:block}
.px{position:absolute;right:-14px;top:-14px;width:34px;height:34px;border-radius:50%;border:2px solid var(--amber);background:#000;color:var(--amber2);font-size:1.2rem;cursor:pointer;z-index:2}
.pi{max-width:270px;display:flex;flex-direction:column;gap:8px}.pi em{font-style:normal;color:var(--amber2);font-size:.8rem}.pi small{color:var(--mute);font-size:.72rem}.ac{display:flex;gap:6px}.pi button{font-family:var(--head);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:.95rem;padding:7px 12px;border:1px solid var(--amber);background:#18120a;color:var(--amber2);cursor:pointer}.pi button:hover,.pi button:focus-visible{background:var(--amber);color:#1a1307;outline:none}.pi select,.pi input,.pi textarea{font:inherit;font-size:.8rem;padding:6px 8px;border:1px solid var(--line);background:#0c0905;color:var(--ink);width:100%}.ag{display:flex;flex-direction:column;gap:6px}.pi b{display:block;font-family:var(--head);font-size:1.6rem;line-height:1.05;color:var(--amber2)}.pi span{color:var(--mute);font-size:.85rem}
@media(max-width:820px){.player{right:0;flex-direction:column;overflow-y:auto;justify-content:flex-start;padding:48px 12px 80px;gap:10px}.pf{height:52vh}.pi{max-width:94vw}}
.chat.min{top:auto;height:auto}
.chat.min .msgs,.chat.min .sug,.chat.min form{display:none}
@media(max-width:820px){
  .chat{left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));width:auto;top:auto;height:54vh}
  .chat.min{height:auto}
  .stats{margin-right:0}
  .chips{max-width:none;bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 64px);right:12px}
  .legend,.ficha{display:none}
  .brand h1{font-size:1.3rem}.brand p{display:none}
  .stat{min-width:62px;padding:4px 8px}.stat b{font-size:1.2rem}
}
</style>

const ray=new THREE.Raycaster(),mp=new THREE.Vector2();let down=null;

  const r=stage.getBoundingClientRect();tip.hidden=false;tip.textContent="";const b=document.createElement("b");b.textContent=v.titulo;tip.append(b,(v.canal||"")+" · "+ETAPAS[v.etapa|0][0]);tip.style.left=Math.min(e.clientX-r.left,r.width-250)+"px";tip.style.top=(e.clientY-r.top)+"px"});

  bt.offset.x=-(tt*.5)%1;rolos.forEach(r=>r.rotation.x+=dt*3);anim.forEach(f=>f(tt));
  paineis.forEach((g,id)=>{const a=alvos[id];if(!a)return;const k=Math.min(1,dt*3);g.position.x+=(a.x-g.position.x)*k;g.position.y+=(a.y-g.position.y)*k;g.position.z+=(a.z-g.position.z)*k;g.scale.setScalar(g.scale.x+(a.s-g.scale.x)*k);g.rotation.y+=(a.r-g.rotation.y)*k});

const msgs=$("#msgs"),chat=$("#chat");
function add(c,t){const d=document.createElement("div");d.className="m "+c;d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d}

$("#chead").onclick=()=>minimiza(!chat.classList.contains("min"));if(innerWidth<820)minimiza(true);
add("a","Fala, Marco! Sou o Fábrik e conheço todo o histórico da fábrica: canais, séries, regras e o que está em produção agora. Peça do seu jeito, por exemplo: \"gere o quarto vídeo das aulas da MWX\". Nada é publicado, agendado ou pago sem o seu ok.");
["Gere o quarto vídeo das aulas da MWX","O que está sendo produzido agora?","Crie um documentário do Além do Hype"].forEach(t=>{const b=document.createElement("button");b.type="button";b.textContent=t;b.onclick=()=>{$("#q").value=t;$("#f").requestSubmit()};$("#sug").appendChild(b)});
let conhecimento=[],nucleo="";
const sem=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function busca(q,n){const ts=sem(q).split(/[^a-z0-9]+/).filter(x=>x.length>2);if(!ts.length)return[];return conhecimento.map(k=>{const h=sem(k.nome+" "+k.descricao),b=sem(k.texto);let s=0;ts.forEach(t=>{if(h.includes(t))s+=4;if(b.includes(t))s+=1});return{k,s}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,n||4).map(x=>({nome:x.k.nome,descricao:x.k.descricao,texto:String(x.k.texto).slice(0,2800)}))}
function resumoFila(){if(!docs.length)return"(esteira vazia: só exemplos na tela)";return docs.map(v=>`- [${v.id}] ${v.titulo} | ${v.canal||""} | ${v.serie?"série "+v.serie+(v.parte?" parte "+v.parte:"")+" | ":""}${v.formato} ${v.aspecto||""} | etapa ${ETAPAS[v.etapa|0][0]} ${Math.round((v.progresso||0)*100)}% | ${v.estado||""} ${v.detalhe?"| "+v.detalhe:""}`).join("\n")}
const SIS=()=>`Você é o Fábrik, robô preto e amarelo, gerente da Fábrica Máquina de Conteúdo (Fábrica de Canais Dark da Jessica) e a EXTENSÃO deste projeto dentro da plataforma: você carrega a memória e o histórico de tudo que foi feito. Quem fala com você pede para ser chamada de Marco: chame-a sempre de Marco. Português do Brasil, curto, direto, tom de gerente de fábrica animado.

NÚCLEO DE CONHECIMENTO (regras e contexto fixos):
${nucleo||"(núcleo ainda não carregado: use buscar_conhecimento)"}

ESTEIRA AGORA (vídeos reais em produção, atualizada ao vivo):
${resumoFila()}

COMO AGIR
- Reconheça pedidos em linguagem natural. "Aulas da MWX" / "Raio-X": é a série Raio-X dos Componentes (MWX, TikTok, kraft, 9:16, 12 partes, de 3 em 3). Partes 1 compressor rotativo, 2 sensor NTC, 3 placa eletrônica estão sendo refeitas (gancho mais forte, 3D de comercial); 4 motor do ventilador, depois capilar e expansão, serpentina, capacitor. "Quarto vídeo" = parte 4. Se o pedido citar canal, série ou formato que você não conhece, use buscar_conhecimento antes de perguntar.
- Para criar um vídeo use pedir_video (um por vídeo). Para séries informe serie, parte e totalPartes. Se já existir na esteira, diga em que etapa está e não duplique.
- Quando um vídeo fica pronto ele aparece como celular no Mural de entregas e na Sala de Validação, ao lado da fábrica, onde a Marco assiste e decide: aprovar, pedir ajuste ou marcar para agendar (conta, dia e hora). Você pode abrir o player (abrir_no_mural). Você NÃO agenda nas plataformas: a equipe agenda depois do ok dela. Use listar_fila ou o resumo acima para dizer o que está em produção. Use buscar_conhecimento para responder sobre histórico, regras, canais, decisões passadas; use as ferramentas de arquivos do projeto (listar e ler) quando precisar de um arquivo.
- Você só REGISTRA pedidos: a produção é feita pelas threads da equipe, que recebem o pedido e atualizam a esteira. Nunca diga que publicou, agendou ou gastou algo, nunca prometa prazo. Diga que o pedido entrou na etapa Pedido e será encaminhado.
- Respeite as regras do núcleo (achadinho sem preço, nunca imagem estática, marcar "gerado por IA", conferir fala contra cena, séries de duas em duas partes com aprovação). Se o pedido violar uma regra, avise e proponha o jeito certo.`;
const historico=[];

  $("#send").disabled=true;const bolha=add("a","…");bub.dataset.fix="1";bub.textContent="Pensando…";
  const tools=[
   {name:"pedir_video",description:"Registra um vídeo novo na esteira (etapa Pedido) para a equipe produzir.",inputSchema:{type:"object",properties:{titulo:{type:"string"},canal:{type:"string"},serie:{type:"string"},parte:{type:"number"},totalPartes:{type:"number"},formato:{type:"string",enum:["kraft","documentario","3d","outro"]},aspecto:{type:"string",enum:["9:16","16:9"]},detalhe:{type:"string",description:"briefing curto do que o vídeo deve ensinar/mostrar"}},required:["titulo","canal","formato","aspecto"]},
    async execute(i){if(!db)throw new Error("Banco indisponível: pedido não gravado.");

     await db.doc("esteira/"+id).set({titulo:String(i.titulo).slice(0,140),canal:String(i.canal).slice(0,80),serie:i.serie||null,parte:i.parte||null,totalPartes:i.totalPartes||null,formato:i.formato,aspecto:i.aspecto,etapa:0,progresso:0,estado:"novo",detalhe:String(i.detalhe||"").slice(0,400),origem:"chat",quando:Date.now()});
     fabVai(0,"Pedido novo na esteira, Marco!");return{ok:true,id}}},
   {name:"listar_fila",description:"Lista os vídeos reais da esteira.",inputSchema:{type:"object",properties:{}},async execute(){return docs.map(v=>({id:v.id,titulo:v.titulo,canal:v.canal,serie:v.serie,parte:v.parte,etapa:ETAPAS[v.etapa|0][0],progresso:v.progresso,estado:v.estado,detalhe:v.detalhe}))}},
   {name:"abrir_no_mural",description:"Abre o player do vídeo pronto dentro da fábrica (precisa ter vídeo no mural).",inputSchema:{type:"object",properties:{id:{type:"string"}},required:["id"]},async execute(i){const v=docs.find(x=>x.id===i.id&&x.video);if(!v)return{erro:"sem vídeo pronto com esse id"};voa("mural");abrePlayer(v);return{ok:true}}},
   {name:"buscar_conhecimento",description:"Busca na memória e no histórico da fábrica (regras, canais, séries, decisões, entregas). Passe palavras-chave.",inputSchema:{type:"object",properties:{termos:{type:"string"}},required:["termos"]},async execute(i){return busca(i.termos,4)}}];
  let ft=null;try{const files=await claude.use("files");if(files&&files.asSampleTools){ft=await files.asSampleTools();if(Array.isArray(ft))ft.forEach(t=>tools.push(t));else if(ft&&ft.tools)ft.tools.forEach(t=>tools.push(t))}}catch(e){}
  try{const r=await sample([{role:"user",content:SIS()},{role:"assistant",content:"Entendido, Marco. Estou pronto."},...historico.slice(-14)],{cache:false,tools,onText:({text})=>{bolha.textContent=text||"…";msgs.scrollTop=msgs.scrollHeight}});
    const t=r.text||"Pronto, Marco.";bolha.textContent=t;historico.push({role:"assistant",content:t})}
  catch(e){bolha.textContent=e&&e.code==="rate_limited"?"Muitas mensagens seguidas, Marco. Espere um pouco.":"Não consegui responder agora. Tente de novo em instantes.";historico.pop()}
